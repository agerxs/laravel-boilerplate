[www]

; Utilisateur et groupe exécutant les processus PHP
user = www-data
group = www-data

; Écoute sur un socket Unix (plus rapide et plus sûr que TCP en local)
; listen = 127.0.0.1:9000
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Gestionnaire de processus : dynamic | ondemand | static
pm = dynamic
pm.max_children = 10
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Timeout pour tuer un script PHP long ou bloqué
request_terminate_timeout = 30s

; Timeout max pour un script lent à démarrer
request_slowlog_timeout = 5s
slowlog = /var/log/php83/www-slow.log

; Journaux d'erreurs
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php83/error.log
php_admin_flag[log_errors] = on

; Restrictions d'accès aux fichiers
php_admin_value[open_basedir] = /var/www:/tmp

; Sécurité : désactivation de fonctions dangereuses
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,parse_ini_file,show_source,phpinfo

; Réduire la taille de buffer pour éviter les fuites mémoire
rlimit_files = 1024
rlimit_core = 0