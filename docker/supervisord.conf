[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:php-fpm]
command=/usr/sbin/php-fpm83 -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/php83/php-fpm.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/php83/php-fpm-error.log
stderr_logfile_maxbytes=10MB

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/nginx/access.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/nginx/error.log
stderr_logfile_maxbytes=10MB

[program:crond]
command=/usr/sbin/crond -f -s /var/log/cron.log
autostart=true
autorestart=true
priority=15
stdout_logfile=/var/log/cron.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/cron-error.log
stderr_logfile_maxbytes=10MB
user=root